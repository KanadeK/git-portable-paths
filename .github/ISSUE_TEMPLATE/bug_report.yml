name: Bug report
description: Report a reproducible defect using synthetic input
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Version, OS, Python version, exact command and a minimal synthetic input
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
